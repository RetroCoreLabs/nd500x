name: Docs site on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs-site/requirements.txt
      - name: Every tracked document is classified by the site policy
        run: python3 tools/gen_docs_site.py --check
      - name: Generate the page tree and navigation
        run: python3 tools/gen_docs_site.py
      - name: Build the site
        run: mkdocs build --strict -f build-site/mkdocs.yml -d "${{ runner.temp }}/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
