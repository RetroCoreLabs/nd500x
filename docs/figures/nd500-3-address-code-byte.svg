<text x="100" y="1032" font-size="12.5" fill="#1F2328">Rows D–F: the low two bits name the index register (00 = R1 … 11 = R4); columns 4–7, 8–B, C–F are the :B, :H, :W displacement sizes.</text>
<text x="100" y="1052" font-size="12.5" fill="#1F2328">Columns 0–3 of those rows are the odd ones out: REGISTER, ABSOLUTE P.I. and the DESC prefix.</text>
<text x="100" y="1080" font-size="12.5" fill="#1F2328">Data part after the code:  :S none (inside the byte, unit = words)   :B 1 byte   :H 2 bytes   :W 4 bytes   address 4 bytes   :D constant 8 bytes.</text>
<text x="100" y="1100" font-size="12.5" fill="#1F2328">Short, byte and halfword displacements are unsigned.</text>
<text x="960" y="1166" text-anchor="end" font-size="11" fill="#5B6470">Source: ND-05.009.4 ND-500 Reference Manual, chapter 8, Figure 29 and the 8.3 survey table (pages 97–101).</text>
