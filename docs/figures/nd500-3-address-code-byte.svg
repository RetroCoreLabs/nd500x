<text x="40" y="52" font-size="30" font-weight="700" fill="#1F2328">The address-code byte</text>
<text x="40" y="84" font-size="16" fill="#5B6470">One byte per operand. Top two bits 00 / 01 / 10: one-byte short forms with 6 bits of data. Top bits 11: extended code, data part follows.</text>
<text x="100" y="122" font-size="12" fill="#5B6470">hatched = post-indexed, adds p·Rn   ·   dashed = prefix, another operand specifier follows</text>
<text x="100" y="138" font-size="12" fill="#5B6470">orange bar on a cell = one of the four bytes used in the anatomy figure: 00, 40, CE, D5</text>
