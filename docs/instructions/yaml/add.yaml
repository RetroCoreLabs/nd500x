  manual_reference:
    section: "11.1"
    title: "Add"
    content: |
      ## 11.1 Add

      **Format:** tn + <addend/r/t>

      | Assembly notation | Name             | Hex code       | Octal code     |
      |-------------------|------------------|----------------|----------------|
      | BYn +             | byte add         | 0FC34H+(n-1)   | 176064B+(n-1)  |
      | Hn +              | halfword add     | 0FC38H+(n-1)   | 176070B+(n-1)  |
      | Wn +              | word add         | 054H+(n-1)     | 124B+(n-1)     |
      | Fn +              | floating add     | 058H+(n-1)     | 130B+(n-1)     |
      | Dn +              | double float add | 05CH+(n-1)     | 134B+(n-1)     |

      **Operation:** Rn + <addend> -> Rn

      **Description:**

      The <addend> operand is added to the contents of the specified register.
      The carry bit is set if a carry occurs from the sign bit position of the
      adder, otherwise it is reset. For overflow, see the section on arithmetical
      traps.

      **Trap conditions:**

      Addressing traps, Integer overflow (O), Floating overflow (FO),
      Floating underflow (FU)

      **Data status bits:**

      - sum.signbit -> S
      - sum = 0 -> Z
      - 0 -> O (float)
      - overflow -> O
      - carry from most significant bit -> C (integer)
      - floating underflow -> FU
      - floating overflow -> FO

      **Example:**

      Add byte argument FIFTHARG to R3

          BY3 + IND(B.FIFTHARG)

      Norsk Data ND-05.009.4 EN

      ---