  examples:
    - description: |
        Basic biconv operation using word register
      prefix: "W"
      code: |
        W1 BICONV W2, B.16
      explanation: |
        Perform biconv operation on word-sized data

    - description: |
        Biconv with byte-sized operands
      prefix: "BY"
      code: |
        BY1 BICONV 5, B.4
      explanation: |
        Byte operation - processes 8-bit values

    - description: |
        Biconv with local (stack) variables
      addressing_mode: "LOCAL"
      code: |
        W1 BICONV B.16, B.32
      explanation: |
        Access local variables using B register (stack frame pointer)

    - description: |
        Biconv with array element access
      addressing_mode: "PRE_INDEXED"
      code: |
        W1 BICONV ARRAY(W2)
      explanation: |
        Array access: ARRAY(W2) computes address as ARRAY + W2 * element_size

    - description: |
        Biconv with floating-point data
      prefix: "F"
      code: |
        F1 BICONV F2, F3
      explanation: |
        Floating-point operation using F registers (32-bit IEEE 754)

    - description: |
        Different variants of biconv instruction
      code: |
        Variant 1/5: BY1 BICONV\nVariant 2/5: BY1 BICONV\nVariant 3/5: BY1 BICONV
      explanation: |
        The biconv instruction has 5 variants for different addressing modes and prefixes

