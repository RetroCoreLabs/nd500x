  examples:
    - description: |
        Add registers non-destructively (from reference manual)
      prefix: "W"
      code: |
        W ADD3 R1, R2, R3
      explanation: |
        Add R1 and R2, store result in R3 (R1 and R2 preserved)

    - description: |
        Add constant to variable
      prefix: "W"
      code: |
        W ADD3 B.VALUE, 100, B.RESULT
      explanation: |
        Add 100 to VALUE and store in RESULT (VALUE unchanged)

    - description: |
        Add local variables
      addressing_mode: "LOCAL"
      code: |
        W ADD3 B.A, B.B, B.SUM
      explanation: |
        Add variables A and B, store result in SUM

    - description: |
        Float addition preserving sources
      prefix: "F"
      code: |
        F ADD3 B.X, B.Y, A1
      explanation: |
        Add X and Y into float register A1 (X, Y unchanged)

    - description: |
        All five variants by data type
      code: |
        BY ADD3 <a>, <b>, <c>  ; Byte (0xFC67)
        H ADD3 <a>, <b>, <c>   ; Halfword (0xFC68)
        W ADD3 <a>, <b>, <c>   ; Word (0xFC69)
        F ADD3 <a>, <b>, <c>   ; Float (0xFC6A)
        D ADD3 <a>, <b>, <c>   ; Double (0xFC6B)
      explanation: |
        ADD3 has 5 variants - one for each data type prefix

  manual_reference:
    section: "11.9"
    title: "Add three operands"
    content: |
      ## 11.9 Add three operands

      **Format:**
      t ADD3 `<a/r/t>,<b/r/t>,<c/w/t>`

      ### Assembly notation

      | Name  | Hex code | Octal code |
      |-------|----------|------------|
      | BY ADD3 | OFC67H | 176147B |
      | H ADD3  | OFC68H | 176150B |
      | W ADD3  | OFC69H | 176151B |
      | F ADD3  | OFC6AH | 176152B |
      | D ADD3  | OFC6BH | 176153B |

      ### Operation:
      `<a> + <b> -> <c>`

      ### Description:

      The `<a>` operand is added to the `<b>` operand and the result is stored in the `<c>` operand. The operands are assumed to have the same data type (see section 7.3 on page 73).

      ### Trap conditions:
      Addressing traps, Integer overflow (O), Floating overflow (FO), Floating underflow (FU)

      ### Data status bits:

      - sum = 0 -> Z
      - sum.signbit -> S
      - overflow -> O
      - carry from most significant bit -> C (integer)
      - floating underflow -> FU
      - floating overflow -> FO

      ### Example:

      Add R1 and R2 and leave the result in R3

      W ADD3 R1,R2,R3

      Norsk Data ND-05.009.4 EN

      ---