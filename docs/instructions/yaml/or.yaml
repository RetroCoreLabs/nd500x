  examples:
    - description: |
        Basic or operation using word register
      prefix: "W"
      code: |
        W1 OR W2
      explanation: |
        Perform or operation on word-sized data

    - description: |
        Or with byte-sized operands
      prefix: "BY"
      code: |
        BY1 OR 5
      explanation: |
        Byte operation - processes 8-bit values

    - description: |
        Or with local (stack) variables
      addressing_mode: "LOCAL"
      code: |
        W1 OR B.16
      explanation: |
        Access local variables using B register (stack frame pointer)

    - description: |
        Or with array element access
      addressing_mode: "PRE_INDEXED"
      code: |
        W1 OR ARRAY(W2)
      explanation: |
        Array access: ARRAY(W2) computes address as ARRAY + W2 * element_size

    - description: |
        Different variants of or instruction
      code: |
        Variant 1/16: BI1 OR\nVariant 2/16: BI1 OR\nVariant 3/16: BI1 OR
      explanation: |
        The or instruction has 16 variants for different addressing modes and prefixes

  manual_reference:
    section: "10.22"
    title: "Or"
    content: |
      ## 10.22 Or

      ### Format:
      tn OR <operand/r/t>

      | Assembly notation | Name               | Hex code         | Octal code       |
      |-------------------|--------------------|------------------|------------------|
      | BIn OR            | bit 'or' register  | OFDB8H-(n-1)     | 176770B-(n-1)    |
      | BYn OR            | byte 'or' register | OFC98H-(n-1)     | 176230B-(n-1)    |
      | Hn OR             | halfword 'or' register | OFC9CH-(n-1) | 176234B-(n-1)    |
      | Wn OR             | word 'or' register | OA0H-(n-1)       | 240B-(n-1)       |

      ### Operation:
      Rn OR <operand> -> Rn

      ### Description:
      A bitwise OR is performed between the contents of the specified register and the <operand> and the result is stored in the register. When the data type is BI, BY, or H, the upper part of the register is zero filled.

      ### Trap conditions:
      Addressing traps

      ### Data status bits:

      result = 0 -> Z
      result.signbit -> S

      ### Example:

      OR byte register R1 with 111 octal

      BY1 OR 111B

      Norsk Data ND-05.009.4 EN

      ---