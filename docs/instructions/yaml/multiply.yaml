  manual_reference:
    section: "11.3"
    title: "Multiply"
    content: |
      ## 11.3 Multiply

      **Format:** tn * <multiplier/r/t>

      | Assembly notation | Name                  | Hex code        | Octal code        |
      |-------------------|-----------------------|-----------------|-------------------|
      | BYn *             | byte multiply         | 0FC44H+(n-1)    | 176104B+(n-1)     |
      | Hn *              | halfword multiply     | 0FC48H+(n-1)    | 176110B+(n-1)     |
      | Wn *              | word multiply         | 06CH+(n-1)      | 154B+(n-1)        |
      | Fn *              | floating multiply     | 070H+(n-1)      | 160B+(n-1)        |
      | Dn *              | double float multiply | 074H+(n-1)      | 164B+(n-1)        |

      **Operation:** Rn * <multiplier> -> Rn

      **Description:**

      The <multiplier> operand is multiplied by the contents of the specified register
      and the product is stored in this register. Integer overflow occurs if the upper
      half of the double length result is not equal to the sign extension of the lower half.

      **Trap conditions:** Addressing traps, Integer overflow (O), Floating overflow (FO),
      Floating underflow (FU)

      **Data status bits:**

      - product = 0 -> Z
      - product.signbit -> S
      - overflow -> O
      - floating underflow -> FU
      - floating overflow -> FO

      **Example:**

      Multiply halfword register R2 by 5

          H2 * 5

      Norsk Data ND-05.009.4 EN

