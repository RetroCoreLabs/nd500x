  manual_reference:
    section: "13.8"
    title: "Call subroutine absolute"
    content: |
      ## 13.8 Call subroutine absolute

      **Format:** CALL <<subr. addr.>>,<no of arg/s/BY>, <arg1/aa/W>,...,<argn/aa/W>

      | Assembly notation | Name                    | Hex code | Octal code |
      |-------------------|-------------------------|----------|------------|
      | CALL              | call subroutine absolute | 0C3H     | 303B       |

      **Operation:**

      Calculate the effective addresses of the arguments and prepare for the entry point
      at <<subr. addr.>>. Jump to the subroutine entry point found at that address.

      **Description:**

      Call the subroutine specified by <<subr. addr.>>. The subroutine address is a
      direct operand in the four bytes following the instruction code. It must refer
      to an entry point instruction, otherwise an instruction sequence error trap
      condition occurs.

      The <<no of arg>> operand must be a constant byte integer, i.e. less than 256.
      Other data types which are not constants will cause an illegal operand specifier
      trap condition.

      The effective addresses of the arguments in the instruction are calculated and
      stored for use by the entry point instruction. The arguments are always interpreted
      as word integers. <argn> operands of type register or constant will cause an
      illegal operand specifier trap condition, as neither registers nor constants have
      an address in data memory.

      **Trap conditions:** Addressing traps, Call trap (CT), Illegal operand specifier (IOS),
      Instruction sequence error (ISE)

      **Data status bits:** Unaffected

      **Example:**

      Call PRINT with arguments UNIT, FORMAT and the local variable VALUE

          CALL PRINT, 3, UNIT, FORMAT, B.VALUE

      Norsk Data ND-05.009.4 EN

      ---