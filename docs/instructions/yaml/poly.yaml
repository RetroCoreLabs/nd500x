  examples:
    - description: |
        Basic poly operation using word register
      prefix: "W"
      code: |
        W1 POLY W2, 20
      explanation: |
        Perform poly operation on word-sized data

    - description: |
        Poly with local (stack) variables
      addressing_mode: "LOCAL"
      code: |
        W1 POLY B.16, 100
      explanation: |
        Access local variables using B register (stack frame pointer)

    - description: |
        Poly with array element access
      addressing_mode: "PRE_INDEXED"
      code: |
        W1 POLY ARRAY(W2)
      explanation: |
        Array access: ARRAY(W2) computes address as ARRAY + W2 * element_size

    - description: |
        Poly with floating-point data
      prefix: "F"
      code: |
        F1 POLY F2, 3.14
      explanation: |
        Floating-point operation using F registers (32-bit IEEE 754)

