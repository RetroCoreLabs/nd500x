  examples:
    - description: |
        Basic intr operation using word register
      prefix: "W"
      code: |
        W1 INTR W2
      explanation: |
        Perform intr operation on word-sized data

    - description: |
        Intr with local (stack) variables
      addressing_mode: "LOCAL"
      code: |
        W1 INTR B.16
      explanation: |
        Access local variables using B register (stack frame pointer)

    - description: |
        Intr with array element access
      addressing_mode: "PRE_INDEXED"
      code: |
        W1 INTR ARRAY(W2)
      explanation: |
        Array access: ARRAY(W2) computes address as ARRAY + W2 * element_size

    - description: |
        Intr with floating-point data
      prefix: "F"
      code: |
        F1 INTR F2
      explanation: |
        Floating-point operation using F registers (32-bit IEEE 754)

    - description: |
        Different variants of intr instruction
      code: |
        Variant 1/8: F1 INTR\nVariant 2/8: F1 INTR\nVariant 3/8: F1 INTR
      explanation: |
        The intr instruction has 8 variants for different addressing modes and prefixes

  manual_reference:
    section: "10.35"
    title: "Integer part with rounding"
    content: |
      ## 10.35 Integer part with rounding

      **Format:** tn INTR <x/r/t>

      | Assembly notation | Name                             | Hex code      | Octal code     |
      |-------------------|----------------------------------|---------------|----------------|
      | Fn INTR           | float integer part with rounding | 0FE68H+(n-1)  | 177150B+(n-1)  |
      | Dn INTR           | double float integer part with rounding | 0FE6CH+(n-1) | 177154B+(n-1) |

      **Operation:** rounded integer part of <x> in float format -> Rn

      **Description:**

      The rounded integer part of the <x> operand is calculated and loaded into
      the specified floating point register in float format. The result is rounded.

      **Trap conditions:** Addressing traps

      **Data status bits:**

      - result = 0 -> Z
      - result.signbit -> S

      **Example:**

      Load F4 with the rounded value 4 bytes away from the location pointed to
      by R3 on the alternative domain, forcing word displacement

          F4 INTR ALT(R3.4:W)

      Norsk Data ND-05.009.4 EN

      ---