      **Format:** CLRK

      | Assembly notation | Name       | Hex code | Octal code |
      |-------------------|------------|----------|------------|
      | CLRK              | clear flag | 0FE03H   | 177003B    |

      **Operation:**
      0 -> K bit of status register

      **Description:**
