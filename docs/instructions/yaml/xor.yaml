  examples:
    - description: |
        Basic xor operation using word register
      prefix: "W"
      code: |
        W1 XOR W2
      explanation: |
        Perform xor operation on word-sized data

    - description: |
        Xor with byte-sized operands
      prefix: "BY"
      code: |
        BY1 XOR 5
      explanation: |
        Byte operation - processes 8-bit values

    - description: |
        Xor with local (stack) variables
      addressing_mode: "LOCAL"
      code: |
        W1 XOR B.16
      explanation: |
        Access local variables using B register (stack frame pointer)

    - description: |
        Xor with array element access
      addressing_mode: "PRE_INDEXED"
      code: |
        W1 XOR ARRAY(W2)
      explanation: |
        Array access: ARRAY(W2) computes address as ARRAY + W2 * element_size

    - description: |
        Different variants of xor instruction
      code: |
        Variant 1/16: BI1 XOR\nVariant 2/16: BI1 XOR\nVariant 3/16: BI1 XOR
      explanation: |
        The xor instruction has 16 variants for different addressing modes and prefixes

  manual_reference:
    section: "10.23"
    title: "Exclusive or"
    content: |
      ### 10.23 Exclusive or

      #### Format:
      tn XOR `<operand/r/t>`

      | Assembly notation | Name               | Hex code         | Octal code       |
      |-------------------|--------------------|------------------|------------------|
      | BIn XOR           | bit 'xor' register | 0FDCC4+(n-1)     | 176714B+(n-1)    |
      | BYn XOR           | byte 'xor' register| 0FCA0H+(n-1)     | 176240B+(n-1)    |
      | Hn XOR            | halfword 'xor' register | 0FCA4H+(n-1) | 176244B+(n-1)    |
      | Wn XOR            | word 'xor' register| 0A4H+(n-1)       | 244B+(n-1)       |

      #### Operation:
      Rn XOR `<operand>` -> Rn

      #### Description:
      A bitwise exclusive OR is performed between the contents of the specified register and the `<operand>` and the result is stored in the register. When the data type is BI, BY, or H, the upper part of the register is zero filled.

      #### Trap conditions:
      Addressing traps

      #### Data status bits:
      result = 0 -> Z
      result.signbit -> S

      #### Example:
      Flip bits 0, 4, 8 and 12 of halfword register R4

      H4 XOR 01111H

      Norsk Data ND-05.009.4 EN

      ---