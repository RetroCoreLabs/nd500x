  manual_reference:
    section: "13.10"
    title: "Subroutine entry points"
    content: |
      ## 13.10 Subroutine entry points

      ### ENTS - enter stack subroutine

      | Assembly notation | Hex code | Octal code |
      |-------------------|----------|------------|
      | ENTS <stack demand/r/W> | 0B8H | 270B |

      **Description:**

      The <stack demand> is the number of bytes needed for the local data field
      of the subroutine, including the predefined locations PREVB, RETA, SP,
      AUX and N (a total of 20 bytes). There will be a stack overflow trap
      condition if B + <stack demand> is greater than or equal to TOS.

      **Trap conditions:** Addressing traps, Stack overflow (STO), Instruction
      sequence error (ISE)

      **Initializations performed:**

      - B.SP -> B
      - oldB -> B.PREVB
      - return address -> B.RETA -> L
      - newB + <stackdemand> -> B.SP
      - number of arguments -> B.N
      - addresses of arguments -> B.ARG

      Norsk Data ND-05.009.4 EN

      ---