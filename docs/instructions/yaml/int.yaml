  manual_reference:
    section: "10.34"
    title: "Integer part"
    content: |
      ## 10.34 Integer part

      **Format:** tn INT <x/r/t>

      | Assembly notation | Name                        | Hex code      | Octal code     |
      |-------------------|-----------------------------|---------------|----------------|
      | Fn INT            | float integer part          | 0FE60H+(n-1)  | 177140B+(n-1)  |
      | Dn INT            | double float integer part   | 0FE64H+(n-1)  | 177144B+(n-1)  |

      **Operation:** truncated integer part of <x> in float format -> Rn

      **Description:**

      The truncated integer part of the <x> operand is calculated and loaded into
      the specified floating register in float format. No rounding is performed.

      **Trap conditions:** Addressing traps

      **Data status bits:**

      - result = 0 -> Z
      - result.signbit -> S

      **Example:**

      Load F4 with the integer part of EXACT

          F4 INT EXACT

      Norsk Data ND-05.009.4 EN

      ---