  manual_reference:
    section: "13.10"
    title: "Subroutine entry points - ENTM"
    content: |
      ## 13.10 Subroutine entry points

      ### ENTM - enter module

      | Assembly notation | Hex code | Octal code |
      |-------------------|----------|------------|
      | ENTM | 0DFH | 337B |

      **Format:** ENTM <<bottom of stack/r/W>>, <stack demand of main program/r/W>,
      <total system stack demand/r/W>

      **Description:**

      When the ENTM entry point is used, a new stack is initialized. A value of
      <stack demand of main program> greater than or equal to <total system stack
      demand> will cause a stack overflow trap condition.

      If ENTM is entered from another domain, TOS is not saved on the old stack,
      but is stored in the domain information table. Also THA, LL and HL are stored
      and new contents for these registers are fetched from the new domain
      information table.

      ENTM is the only entry point that may be called from another domain.

      **Trap conditions:** Addressing traps, Instruction sequence error (ISE),
      Stack overflow (STO)

      **Initializations performed:**

      - <<bottom of stack>> -> B
      - oldB -> B.PREVB
      - TOS -> IND(oldB.SP)
      - <<bottom of stack>> + <total system stack demand> -> TOS
      - return address -> B.RETA -> L
      - <<bottom of stack>> + <stack demand of main program> -> B.SP
      - number of arguments -> B.N
      - addresses of arguments -> B.arg

      **If change of domain:**

      - 0 -> B.PREVB
      - 0 -> B.RETA
      - TOS, LL, HL, THA -> old domain information table
      - TOS, LL, HL, THA entries in new domain information table -> TOS, LL, HL, THA

      Norsk Data ND-05.009.4 EN

      ---