  manual_reference:
    section: "13.1"
    title: "Unconditional relative jump"
    content: |
      ## 13.1 Unconditional relative jump

      **Format:** GO <<displacement>>

      | Assembly notation | Name          | Hex code | Octal code |
      |-------------------|---------------|----------|------------|
      | GO:B              | jump byte     | 0C0H     | 300B       |
      | GO:H              | jump halfword | 0C1H     | 301B       |
      | GO:W              | jump word     | 0C2H     | 302B       |

      **Operation:** P + <<displacement>> -> P

      **Description:**

      Perform a jump relative to the current program counter value. GO uses
      a direct operand and has three formats, with a byte, halfword, or word
      displacement part. The displacement is signed and is found in the 1, 2
      or 4 bytes following the instruction code.

      **Trap conditions:** Addressing traps, Branch trap (BT)

      **Data status bits:** Unaffected

      **Example:**

      Jump to BACK (Assembler will calculate displacement)

          BACK:
          .
          .
          .
          GO BACK

      Norsk Data ND-05.009.4 EN

      ---