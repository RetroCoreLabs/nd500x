  examples:
    - description: |
        Basic rem operation using word register
      prefix: "W"
      code: |
        W1 REM W2, B.16, R.8
      explanation: |
        Perform rem operation on word-sized data

    - description: |
        Rem with local (stack) variables
      addressing_mode: "LOCAL"
      code: |
        W1 REM B.16, B.32, B.48
      explanation: |
        Access local variables using B register (stack frame pointer)

    - description: |
        Rem with array element access
      addressing_mode: "PRE_INDEXED"
      code: |
        W1 REM ARRAY(W2)
      explanation: |
        Array access: ARRAY(W2) computes address as ARRAY + W2 * element_size

    - description: |
        Rem with floating-point data
      prefix: "F"
      code: |
        F1 REM F2, F3, F4
      explanation: |
        Floating-point operation using F registers (32-bit IEEE 754)

    - description: |
        Different variants of rem instruction
      code: |
        Variant 1/8: F1 REM\nVariant 2/8: F1 REM\nVariant 3/8: F1 REM
      explanation: |
