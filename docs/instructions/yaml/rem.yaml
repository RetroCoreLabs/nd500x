  examples:
    - description: |
        Floating point remainder (from manual)
      prefix: "F"
      code: |
        F2 REM R.EXPENSES, R.AMOUNT, R.UNITCOST
      explanation: |
        Divide EXPENSES by AMOUNT, store integer quotient in UNITCOST, remainder in F2

    - description: |
        Floating point remainder with local variables
      prefix: "F"
      code: |
        F1 REM B.X, B.Y, B.Q
      explanation: |
        Calculate remainder of X/Y, store quotient in Q, remainder in F1

    - description: |
        Double precision remainder
      prefix: "D"
      code: |
        D1 REM B.DIVIDEND, B.DIVISOR, B.QUOTIENT
      explanation: |
        Double precision remainder calculation

    - description: |
        All eight variants (F/D only)
      code: |
        F1 REM <x>, <y>, <q>  ; Float reg 1 (0xFE58)
        F2 REM <x>, <y>, <q>  ; Float reg 2 (0xFE59)
        D1 REM <x>, <y>, <q>  ; Double reg 1 (0xFE5C)
        D2 REM <x>, <y>, <q>  ; Double reg 2 (0xFE5D)
      explanation: |
        REM has 8 variants: F1-F4 (float) and D1-D4 (double)

  manual_reference:
    section: "10.33"
    title: "Floating point remainder"
    content: |
      ## 10.33 Floating point remainder

      **Format:** tn REM <x/r/t>,<y/r/t>,<q/w/t>

      | Assembly notation | Name                              | Hex code      | Octal code      |
      |-------------------|-----------------------------------|---------------|-----------------|
      | Fn REM            | float divide with remainder       | 0FE58H+(n-1)  | 177130B+(n-1)   |
      | Dn REM            | double float divide with remainder| 0FE5CH+(n-1)  | 177134B+(n-1)   |

      **Operation:**

      - remainder of <x>/<y> in float format -> Rn
      - integer part of <x>/<y> in float format -> <q>

      **Description:**

      The value of the <x> operand is divided by the value of the <y> operand
      and the integer part of the quotient in float format stored in <q>.
      The remainder of the quotient in float format is loaded into the
      specified register.

      Algorithms used:
      <q> = int(<x>/<y>)
      Rn = <x> - <q>*<y>

      Note: Some precision may be lost in the subtraction if the quotient
      <x>/<y> is large. If it is so large that the binary point is outside
      the floating format, then int(<x>/<y>) = <x>/<y>, and Rn will be zero.

      **Trap conditions:** Addressing traps, Floating overflow (FO),
      Floating underflow (FU), Divide by zero (DZ)

      **Data status bits:**

      - remainder = 0 -> Z
      - remainder.signbit -> S
      - floating underflow -> FU
      - floating overflow -> FO
      - <y> = 0 -> DZ

      **Example:**

      Divide record variables EXPENSES with AMOUNT giving UNITCOST and remainder in F2

          F2 REM R.EXPENSES, R.AMOUNT, R.UNITCOST

      Norsk Data ND-05.009.4 EN

