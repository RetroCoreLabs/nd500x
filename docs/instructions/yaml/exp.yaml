        Perform exp operation on word-sized data

    - description: |
        Exp with local (stack) variables
      addressing_mode: "LOCAL"
      code: |
        W1 EXP B.16
      explanation: |
        Access local variables using B register (stack frame pointer)

    - description: |
        Exp with array element access
      addressing_mode: "PRE_INDEXED"
      code: |
        W1 EXP ARRAY(W2)
      explanation: |
        Array access: ARRAY(W2) computes address as ARRAY + W2 * element_size

    - description: |
        Exp with floating-point data
      prefix: "F"
      code: |
        F1 EXP F2
      explanation: |
        Floating-point operation using F registers (32-bit IEEE 754)

