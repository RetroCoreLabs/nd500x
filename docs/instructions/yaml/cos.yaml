        D2 COS <arg>  ; Double reg 2 (0xFF8D)
      explanation: |
        COS has 8 variants: F1-F4 (float) and D1-D4 (double)

  manual_reference:
    section: "12.7"
    title: "Cosine"
    content: |
      # 12.7 Cosine

      **Format:** tn COS <argument/r/t>

      | Assembly notation | Name                | Hex code       | Octal code      |
      |-------------------|---------------------|----------------|-----------------|
      | Fn COS            | float cosine        | OFF60H+(n-1)   | 177540B+(n-1)   |
      | Dn COS            | double float cosine | OFF8CH+(n-1)   | 177614B+(n-1)   |

      **Operation:** cosine(<argument>) -> Rn

      **Description:**

      The trigonometric cosine of <argument> is loaded into the specified float
      or double float register. The maximum absolute value of <argument> is
      65536.0 radians; a larger value will cause an invalid operation trap
      condition and the specified register will be set to zero.

      **Trap conditions:** Addressing traps, Invalid operation (IVO)

      **Data status bits:**

      - result = 0 -> Z
      - result.signbit -> S

      **Example:**

      Calculate the cosine of double-precision ANGLE and load into D2

          D2 COS ANGLE

      Norsk Data ND-05.009.4 EN

      ---