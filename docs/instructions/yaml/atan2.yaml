  examples:
    - description: |
        Arc tangent two-argument (from manual)
      prefix: "D"
      code: |
        D3 ATAN2 WIDTH, DIST
      explanation: |
        Load into D3 the arc tangent of WIDTH divided by DIST

    - description: |
        Arc tangent two-argument with float
      prefix: "F"
      code: |
        F1 ATAN2 B.Y, B.X
      explanation: |
        Calculate atan2(Y, X) giving angle in correct quadrant

    - description: |
        Arc tangent two-argument with registers
      prefix: "F"
      code: |
        F2 ATAN2 F3, F4
      explanation: |
        Calculate atan2 from register values

    - description: |
        All eight variants (F/D only)
      code: |
        F1 ATAN2 <num>, <den>  ; Float reg 1 (0xFF70)
        F2 ATAN2 <num>, <den>  ; Float reg 2 (0xFF71)
        D1 ATAN2 <num>, <den>  ; Double reg 1 (0xFF9C)
        D2 ATAN2 <num>, <den>  ; Double reg 2 (0xFF9D)
      explanation: |
        ATAN2 has 8 variants: F1-F4 (float) and D1-D4 (double)

  manual_reference:
    section: "12.11"
    title: "Arc tangent two argument"
    content: |
      # 12.11 Arc tangent two argument

      **Format:**
      tn ATAN2 <num/r/t>, <den/r/t>

      | Assembly notation | Name       | Hex code    | Octal code       |
      |-------------------|------------|-------------|------------------|
      | Fn ATAN2          | float arctangent2 | OFF70H+(n-1) | 177560B+(n-1) |
      | Dn ATAN2          | double float arctangent2 | OFF9CH+(n-1) | 177634B+(n-1) |

      **Operation:**
      arctangent(<num>/<den>) -> Rn

      **Description:**

      The trigonometric arc tangent of <num>/<den> is loaded into the specified float or double float register. The result value gives the angle in radians in the correct quadrant in the range -pi to pi. A zero value of both <num> and <den> will cause an invalid operation trap condition and the specified register will be set to zero.

      **Trap conditions:**
      Addressing traps, Invalid operation (IVO)

      **Data status bits:**

      result = 0 -> Z
      result.signbit -> S

      **Example:**

      Load into D3 the arc tangent of WIDTH divided by DIST

          D3 ATAN2 WIDTH, DIST

      Norsk Data ND-05.009.4 EN

      ---