  examples:
    - description: |
        Basic move operation using word register
      prefix: "W"
      code: |
        W1 MOVE W2, B.16
      explanation: |
        Perform move operation on word-sized data

    - description: |
        Move with byte-sized operands
      prefix: "BY"
      code: |
        BY1 MOVE 5, B.4
      explanation: |
        Byte operation - processes 8-bit values

    - description: |
        Move with local (stack) variables
      addressing_mode: "LOCAL"
      code: |
        W1 MOVE B.16, B.32
      explanation: |
        Access local variables using B register (stack frame pointer)

    - description: |
        Move with array element access
      addressing_mode: "PRE_INDEXED"
      code: |
        W1 MOVE ARRAY(W2)
      explanation: |
        Array access: ARRAY(W2) computes address as ARRAY + W2 * element_size

    - description: |
        Move with floating-point data
      prefix: "F"
      code: |
        F1 MOVE F2, F3
      explanation: |
        Floating-point operation using F registers (32-bit IEEE 754)

    - description: |
        Different variants of move instruction
      code: |
        Variant 1/6: BI1 MOVE\nVariant 2/6: BI1 MOVE\nVariant 3/6: BI1 MOVE
      explanation: |
        The move instruction has 6 variants for different addressing modes and prefixes

  manual_reference:
    section: "10.7"
    title: "Move"
    content: |
      ## 10.7 Move

      **Format:**
      t MOVE <source/r/t>,<dest/w/t>

      | Assembly notation | Name               | Hex code | Octal code |
      |-------------------|--------------------|----------|------------|
      | BI MOVE           | move bit           | 0FC0BH   | 176013B    |
      | BY MOVE           | move byte          | 019H     | 031B       |
      | H MOVE            | move halfword      | 0FC14H   | 176024B    |
      | W MOVE            | move word          | 01AH     | 032B       |
      | F MOVE            | move float         | 01BH     | 033B       |
      | D MOVE            | move double float  | 02CH     | 054B       |

      **Operation:**
      <source> -> <dest>

      **Description:**

      The number of bits needed to represent the data type are moved from source to destination. The source is unaffected, and a constant destination operand is illegal.

      **Trap conditions:** Addressing traps

      **Data status bits:**

      <source> = 0 -> Z
      <source>.signbit -> S

      **Example:**

      Move the double precision value in GLOBAL to local variable LOCAL

          D MOVE GLOBAL, B.LOCAL

      Norsk Data ND-05.009.4 EN

      ---