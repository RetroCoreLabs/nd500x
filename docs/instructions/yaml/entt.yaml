  manual_reference:
    section: "13.10"
    title: "Subroutine entry points - ENTT"
    content: |
      ## 13.10 Subroutine entry points

      ### ENTT - enter trap handler

      | Assembly notation | Hex code | Octal code |
      |-------------------|----------|------------|
      | ENTT <trap handler main program stack demand/r/W>, <total trap handler stack demand/r/W> | 0BCH | 274B |

      **Description:**

      ENTT is the trap handler entry point. A trap handler is called when a trap
      condition arises and the trap enable bit is set for the trap in question.
      When a trap handler routine is called, the start address is taken from a
      trap handler entry point vector. The THA register holds the address of
      this vector. The area following the trap handler vector is used as a local
      data area for the trap handler routine called.

      The register block is stacked as shown in table 5 on page 12.

      The instruction may start at any byte in the first word. 'Trapping P',
      saved as arg1, is the address of the first byte of the instruction
      causing the trap.

      **Trap conditions:** Addressing traps, Instruction sequence error (ISE)

      (No traps are handled locally.)

      Norsk Data ND-05.009.4 EN

