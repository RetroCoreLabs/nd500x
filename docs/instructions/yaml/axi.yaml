        Perform axi operation on word-sized data

    - description: |
        Axi with local (stack) variables
      addressing_mode: "LOCAL"
      code: |
        W1 AXI B.16, B.32
      explanation: |
        Access local variables using B register (stack frame pointer)

    - description: |
        Axi with array element access
      addressing_mode: "PRE_INDEXED"
      code: |
        W1 AXI ARRAY(W2)
      explanation: |
        Array access: ARRAY(W2) computes address as ARRAY + W2 * element_size

