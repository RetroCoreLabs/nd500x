      addressing_mode: "LOCAL"
      code: |
        W ADD2 B.TOTAL, B.VALUE
      explanation: |
        Add VALUE to TOTAL (both local stack variables)

    - description: |
        Increment counter
      prefix: "W"
      code: |
        W ADD2 B.COUNTER, 1
      explanation: |
        Increment word counter by 1

    - description: |
        All five variants by data type
      code: |
        BY ADD2 <dest>, <src>  ; Byte (0xFC17)
        H ADD2 <dest>, <src>   ; Halfword (0xFC54)
        W ADD2 <dest>, <src>   ; Word (0x0053)
        F ADD2 <dest>, <src>   ; Float (0xFC56)
        D ADD2 <dest>, <src>   ; Double (0xFC57)
      explanation: |
        ADD2 has 5 variants - one for each data type prefix

  manual_reference:
    section: "11.5"
    title: "Add two operands"
    content: |
      ### 11.5 Add two operands

      **Format:**
      t ADD2 `<a/rw/t>,<b/r/t>`

      **Assembly notation**
      | Name   | Hex code | Octal code |
      |--------|----------|------------|
      | BY ADD2 | 0FC17H  | 176027B    |
      | H ADD2  | 0FC54H  | 176124B    |
      | W ADD2  | 053H    | 123B       |
      | F ADD2  | 0FC56H  | 176126B    |
      | D ADD2  | 0FC57H  | 176127B    |

      **Operation:**
      `<a> + <b> -> <a>`

      **Description:**

      The `<b>` operand is added to the `<a>` operand and the result is put in the `<a>` operand. The operands are assumed to have the same data type (see section 7.3 on page 73).

      **Trap conditions:**
      - Addressing traps
      - Integer overflow (O)
      - Floating overflow (FO)
      - Floating underflow (FU)

      **Data status bits:**

      - result = 0 -> Z
      - result.signbit -> S
      - overflow -> O
      - carry from most significant bit -> C (integer)
      - floating underflow -> FU
      - floating overflow -> FO

      **Example:**

      Add float argument X2 to argument X1

          F ADD2 IND(B.X1), IND(B.X2)

      Norsk Data ND-05.009.4 EN

      ---